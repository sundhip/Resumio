name: Visual Regression Review & Golden Update

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for approving intentional UI snapshot changes'
        required: true
        default: 'Approved intentional UI polish changes for release'

jobs:
  update-goldens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Re-capture and Update Golden Baselines
        run: npm run test:visual:update

      - name: Commit Updated Golden Baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ui-audit/r8/
          git commit -m "chore(ui): update visual regression baseline goldens [skip ci] - ${{ github.event.inputs.reason }}" || exit 0
          git push
