name: Resumio CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Fast Lint (Oxlint)
        run: npx oxlint --quiet

      - name: Design Token Compliance Check
        run: npm run check:tokens

      - name: i18n & Microcopy Integrity Check
        run: npm run check:i18n

      - name: Run Master Test Suite (25 Suites)
        run: npm test

      - name: Frontend Build Check
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Visual Regression Test Suite
        run: npm run test:visual

      - name: Upload Visual Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshots
          path: docs/ui-audit/r8/

      - name: Validate ML Service Syntax
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic
          python -m py_compile services/ml/main.py
