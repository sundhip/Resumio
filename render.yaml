services:
  # Backend API & Application Service
  - type: web
    name: resumio-backend
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: resumio_prod
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/health
    disk:
      name: resumio-data
      mountPath: /app/server/uploads
      sizeGB: 1
